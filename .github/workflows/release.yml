# Builds the release artifacts and attaches them to the GitHub release: the service binary
# (framewidged, which install.sh downloads) and the widget package (.plasmoid).
# Trigger: a version tag (1.3, 1.3-beta1, ...), which arrives through the mirror from
# git.arianw.de. The release notes are the tag's section of CHANGELOG.md.
# A pre-release tag (1.4-beta1) uses the section and version of its base: CHANGELOG.md needs
# "## [1.4] — date" and package/metadata.json version 1.4 before the tag, not "## Unreleased".
#
# Static musl build of the service: runs on any Linux, whatever its glibc.
name: release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  service:
    # GitHub only: Gitea releases never get artifacts. The jobs below depend on this one.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # dbus: the service tests run their own dbus-daemon.
          sudo apt-get update && sudo apt-get install -y musl-tools dbus
          rustup target add x86_64-unknown-linux-musl

      - name: Tests
        run: cargo test --locked --manifest-path service/Cargo.toml

      - name: Build
        run: |
          cargo build --release --locked --manifest-path service/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir out
          cp service/target/x86_64-unknown-linux-musl/release/framewidged out/framewidged-x86_64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: service
          path: out/
          if-no-files-found: error

  widget:
    needs: service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks the versions against the tag and that no demo code ships.
      - name: Package
        run: scripts/package.sh "$GITHUB_REF_NAME" out

      - uses: actions/upload-artifact@v4
        with:
          name: widget
          path: out/
          if-no-files-found: error

  release:
    needs: [service, widget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Section "## [1.3]", "## 1.3" or "## v1.3" (then a space or the end of the line, normally
      # "## [1.3] — YYYY-MM-DD"). No section, or an empty one: fail.
      - name: Notes from CHANGELOG.md
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag%%-*}"
          awk -v v="$version" '
            /^## / {
              if (on) exit
              h = substr($0, 4); sub(/^\[/, "", h); sub(/^v/, "", h)
              if (substr(h, 1, length(v)) == v) {
                rest = substr(h, length(v) + 1)
                if (rest == "" || rest ~ /^[] ]/) { on = 1; next }
              }
            }
            on
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no notes for $version (## [$version] — YYYY-MM-DD)"; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            prerelease=""
            [[ "$tag" =~ (alpha|beta|rc) ]] && prerelease="--prerelease"
            gh release create "$tag" out/* --title "FrameWidge $tag" --notes-file notes.md $prerelease
          fi
