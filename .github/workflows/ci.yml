# Checks on every push: the service (cargo test, clippy, rustfmt), then
# tests/run_all.sh (QML unit tests against the mock
# backend, package and lint checks, the widget loaded in plasmawindowed offscreen).
#
# Arch Linux container: current Qt 6, KF6 and Plasma from the packages, as on the development
# machine. The smoke tests skip a check whose tool is missing; the step below fails instead, so
# a missing package cannot turn the run green.
#
# Public mirror: Gitea pushes every branch and tag here on each commit.
# This runs the checks and reports them back to the commit on Gitea as
# the status "github / test", where the pull requests live. There are no
# pull requests on GitHub, so everything runs on push.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the
# repository (commit statuses).
name: CI

on:
  push:
    branches: ["**"]

# No concurrency group: every commit runs to the end and keeps its own
# status, a newer push does not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/framewidge/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git nodejs python dbus qt6-declarative qt6-5compat \
            kirigami libplasma plasma-workspace kpackage kcmutils plasma-activities rust python-gobject
          # qmllint and qmltestrunner of Qt 6 live here; the smoke test looks them up on PATH.
          export PATH="/usr/lib/qt6/bin:$PATH" && echo /usr/lib/qt6/bin >> "$GITHUB_PATH"
          for t in qmltestrunner qmllint kpackagetool6 plasmawindowed; do
            command -v "$t" >/dev/null || { echo "::error::$t missing"; exit 1; }
          done
      - uses: actions/checkout@v4
      # Release headings "## [X.Y] — YYYY-MM-DD": a wrong one shows up here, not at the tag.
      - name: CHANGELOG.md headings
        run: scripts/release-notes.sh --check
      # The service on a private D-Bus against a fake framework_tool and sysfs; real EC access
      # needs a Framework laptop.
      - name: Service
        run: |
          cd service
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # plasmawindowed needs a session bus (without one it exits with status 1). Services it
      # starts over D-Bus (kactivitymanagerd, the portal, ksecretd) outlive it and inherit its
      # output: into a file, so no open pipe keeps the step waiting.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rc=0; dbus-run-session -- tests/run_all.sh > tests.log 2>&1 || rc=$?
          cat tests.log; exit $rc

  # Also runs when test failed or was cancelled, so Gitea never keeps a
  # stale "pending".
  report:
    needs: test
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          case "$RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          desc=$RESULT
          if [ -n "$STARTED" ]; then desc="$RESULT in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULT: ${{ needs.test.result }}
          STARTED: ${{ needs.test.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
