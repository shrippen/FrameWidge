<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- framewidged on the system bus: only root may own the name, everyone
     may call it. Changing settings is checked per call with polkit
     (io.github.shrippen.FrameWidge.policy). -->
<busconfig>
  <policy user="root">
    <allow own="io.github.shrippen.FrameWidge"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.shrippen.FrameWidge"/>
  </policy>
</busconfig>
