[package]
name = "framewidged"
version = "1.3.0"
edition = "2021"
description = "FrameWidge backend: fans, power and battery of Framework laptops over a local REST API"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
