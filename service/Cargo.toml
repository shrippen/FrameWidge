[package]
name = "framewidged"
version = "1.3.0"
edition = "2021"
description = "FrameWidge backend: fans and battery of Framework laptops over D-Bus"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
blocking = "1"

[profile.release]
lto = true
strip = true
