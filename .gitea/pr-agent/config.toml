# PR-Agent settings for FrameWidge (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of FrameWidge, a KDE Plasma 6 tray widget (QML,
Kirigami, KantePlasma) for Framework laptops: fan control, power
profile, battery and sensor telemetry through its own service framewidged
(Rust, system D-Bus, polkit; service/).
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Hardware: fan curves, duty or power settings that can overheat the
  machine, or leave a fan in manual mode when the service stops or
  framework_tool fails.
- D-Bus calls without error handling; writes without the polkit check.
- Kante copies (package/contents/ui/Kante*) edited instead of synced;
  raw colours or sizes instead of Kante roles.
- Missing tests for new behaviour.
- Breaches of the repository rules (agent.md).

Skip style, naming and formatting (the tests run separately), praise, and
guesses you cannot back with the diff. When you find nothing that
matters, say so in one line.
"""
